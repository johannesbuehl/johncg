log_level: INFO # log-level - valid-values: ALL MARK TRACE DEBUG INFO WARN ERROR FATAL OFF
behaviour:
  activate_item_on_add: true # show the first slide when loading - valid-values: true false
  # bible_citation_style: 1. Moses 1,2-4.6; 7
  bible_citation_style: 1. Moses 1:2-4, 6;7
  transition_length: 12 # transition-length in frames
path: # path to the different files
  playlists: D:/JohnCG-Johannes/12_Abläufe/ # song-files
  songs: D:/JohnCG-Johannes/80_Songs/Lieder # pdf-files
  psalms: D:/JohnCG-Johannes/80_Songs/Psalme # psalm-files
  pdfs: D:/JohnCG-Johannes/60_PDF/ # playlist-files
  bible: files/Bible/Lutherbibel.json # used bible
casparcg_connections: # individual CasparCG-connections
  - host: 127.0.0.1
    port: 5250
    channel: 1
    layers:
      media: 20 # used for media-playback - Can be removed to don't show media
      template: 21 # used for templates and song-/psalm-/countdown-text
    # path: D:/Streaming/casparcg_v2.4.0 # - optional path to CasparCG-directory to auto-start at launch
    path: D:\Lighthouse\JohnCG_0.9.0-rc.1_win32_v2\casparcg_v2.4.0
    # stageview: true # optional - show song-chords and hide song-backgrounds
  - host: 127.0.0.1
    port: 5250
    channel: 2
    layers:
      media: 20 # used for media-playback - Can be removed to don't show media
      template: 21 # used for templates and song-/psalm-/countdown-text
    # path: D:/Streaming/casparcg_v2.4.0 # - optional path to CasparCG-directory to auto-start at launch
    stageview: true # optional - show song-chords and hide song-backgrounds
client_server:
  http:
    port: 8888 # port for the client-interface web-server
  websocket:
    port: 8765 # port for the websocket-communication between client and server (needs to be changed in client/assets/main-*.js - search for 'port:"')