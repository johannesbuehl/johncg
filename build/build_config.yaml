builds:
  server:
    script: server-build
    entry: main.js
    script_path: JohnCG
    files:
      - main.js
  client:
    script: client-build
    files:
      - client
  templates:
    script: templates-build
    files: []
configs:
  server:
    schema: config.schema.json
    orig: config_default.yaml
    dest: config.yaml
external_packages:
  - pdf-parse
  - sharp

copy:
  - orig: casparcg
  - orig: files/Bibles
    dest: Bibles
  - orig: files/Psalms
    dest: Psalms
  - orig: files/Songs
    dest: Songs
  - orig: typst/johncg-export.typ
mkdir:
  - Playlists
  - PDFs
release_dir: dist
license_report:
  config:
    ignore:
      - dist/*
  path: licenses
  license:
    path: LICENSE
